services:
  bastion:
    build: .
    container_name: bastion
    restart: unless-stopped
    ports:
      - "${BASTION_PORT:-3000}:3000"
    volumes:
      - bastion-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "3000"
      JWT_SECRET: ${JWT_SECRET:-changez-moi-en-production-avec-une-longue-chaine-aleatoire}
      BASTION_ENCRYPTION_KEY: ${BASTION_ENCRYPTION_KEY:-}
      BASTION_ADMIN_USER: ${BASTION_ADMIN_USER:-admin}
      BASTION_ADMIN_PASSWORD: ${BASTION_ADMIN_PASSWORD:-admin}
      GUACD_HOST: guacd
      GUACD_PORT: "4822"
      DATABASE_PATH: /app/data/bastion.json
      BASTION_RDP_SECURITY: "${BASTION_RDP_SECURITY:-nla|tls|rdp|any}"
      BASTION_RDP_DISABLE_GFX: "${BASTION_RDP_DISABLE_GFX:-true}"
      BASTION_WOL_BROADCAST: "${BASTION_WOL_BROADCAST:-}"
      WOL_RELAY_URL: "${WOL_RELAY_URL:-http://host.docker.internal:9877}"
    depends_on:
      guacd:
        condition: service_started
      wol-relay:
        condition: service_started
    networks:
      - bastion-net

  wol-relay:
    build: ./wol-relay
    container_name: bastion-wol-relay
    restart: unless-stopped
    network_mode: host

  guacd:
    image: guacamole/guacd:1.6.0
    container_name: bastion-guacd
    restart: unless-stopped
    environment:
      HOME: /home/guacd
      LOG_LEVEL: info
    volumes:
      - guacd-home:/home/guacd
    networks:
      - bastion-net

volumes:
  bastion-data:
  guacd-home:

networks:
  bastion-net:
    driver: bridge
